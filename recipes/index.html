<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Books</title>
    <link rel="stylesheet" href="recipes.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
    <div class="logo">
        <img src="images/recipe-book.png" alt="Recipe Book"></div>

    <h1>RecipeBook</h1>
    </header>

    <div class="search-container">
    <form action="/search-results-page" method="GET" role="search">
        <label for="site-search"></label>
        <input type="search" id="site-search" name="q" placeholder="Find a Recipe" required>
        <button type="submit"><img src="images/search.svg" alt="Search"></button>
    </form>
    </div>

    <article class="recipe-card">
        <img src="images/apple-crisp.jpg" class="recipe-img" alt="Apple Crisp">

        <div class="recipe-info">
        <span class="tag">Dessert</span>

        <h2 class="recipe-title">Apple Crisp</h2>
    
        <span
            class="rating"
            role="img"
            aria-label="Rating: 4 out of 5 stars"
        >
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
    
        <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
        </div>
    </article>
</body>
    <footer>    
        
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                         
        
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>                   
    </footer>
</html>
